    <main>
        <h1>LIÊN HỆ VỚI TÔI</h1>
        <p>Bạn có dự án hoặc ý tưởng cần thực hiện? Hãy gửi tin nhắn cho tôi!</p>

        <section>
            <h3>Gửi tin nhắn</h3>
            <form action="#">
                <p>
                    <label>Họ và tên:</label><br>
                    <input type="text" name="fullname" placeholder="Nhập tên của bạn">
                </p>
                <p>
                    <label>Email:</label><br>
                    <input type="email" name="email" placeholder="Nhập email của bạn">
                </p>
                <p>
                    <label>Nội dung tin nhắn:</label><br>
                    <textarea name="message" rows="5" cols="30"></textarea>
                </p>
                <p>
                    <button type="submit">Gửi tin nhắn</button>
                </p>
            </form>
        </section>

        <section>
            <h3>Thông tin khác</h3>
            <p><strong>Địa chỉ:</strong> Nha Trang, Khánh Hòa, Việt Nam</p>
            <p><strong>Mạng xã hội:</strong></p>
            <ul>
                <li><a href="#">LinkedIn</a></li>
                <li><a href="#">GitHub</a></li>
                <li><a href="#">Email trực tiếp</a></li>
            </ul>
        </section>
